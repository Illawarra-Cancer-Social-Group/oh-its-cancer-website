<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <!-- Retro background pattern: boomerangs, sparkles, atomic stars and dots.
       Used as a CSS mask, so only the shapes matter, not the colour. -->
  <defs>
    <path id="sparkle" d="M12 0C13 9 15 11 24 12C15 13 13 15 12 24C11 15 9 13 0 12C9 11 11 9 12 0Z"/>
    <path id="boomerang" d="M0 24C8 4 30 -2 46 10C33 7 20 12 10 30C7 34 2 30 0 24Z"/>
    <g id="atomic" stroke="black" stroke-width="1.2" stroke-linecap="round">
      <line x1="0" y1="12" x2="24" y2="12"/><line x1="12" y1="0" x2="12" y2="24"/>
      <line x1="4" y1="4" x2="20" y2="20"/><line x1="20" y1="4" x2="4" y2="20"/>
      <circle cx="0" cy="12" r="1.8"/><circle cx="24" cy="12" r="1.8"/><circle cx="12" cy="0" r="1.8"/><circle cx="12" cy="24" r="1.8"/>
      <circle cx="12" cy="12" r="2"/>
    </g>
  </defs>
  <use href="#boomerang" transform="translate(18 30) rotate(-15)"/>
  <use href="#boomerang" transform="translate(150 150) rotate(150) scale(0.8)"/>
  <use href="#boomerang" transform="translate(196 34) rotate(40) scale(0.6)"/>
  <use href="#sparkle" transform="translate(120 20) scale(0.9)"/>
  <use href="#sparkle" transform="translate(40 150) scale(1.3)"/>
  <use href="#sparkle" transform="translate(200 200) scale(0.6)"/>
  <use href="#sparkle" transform="translate(96 108) scale(0.45)"/>
  <use href="#atomic" transform="translate(150 80)"/>
  <use href="#atomic" transform="translate(80 200) scale(0.7)"/>
  <use href="#atomic" transform="translate(10 96) scale(0.55)"/>
  <circle cx="70" cy="70" r="3"/><circle cx="210" cy="120" r="2.5"/><circle cx="120" cy="170" r="2"/>
  <circle cx="30" cy="220" r="2.5"/><circle cx="180" cy="10" r="2"/><circle cx="105" cy="60" r="1.8"/>
</svg>
