# Runs "npm run check" on every pull request and on every change to main.
# The main branch ruleset requires this check to pass before merging.
# Actions are pinned to exact commits so they can't change underneath us.

name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: npm run check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install exact versions from the lockfile
        run: npm ci

      - name: Install the test browser
        run: npx playwright install --with-deps chromium

      - name: Types, build, accessibility and smoke tests
        run: npm run check
